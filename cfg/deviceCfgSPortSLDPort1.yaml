  # ----- Port 0 / LD 3 / Range 0 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 0
      LDID: 3
      RangeID: 0
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 0 / LD 3 / Range 1 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 0
      LDID: 3
      RangeID: 1
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 1 / LD 0 / Range 0 -----
  - Type: LD.Range
    Enable: true
    Value:
      PortID: 1
      LDID: 0
      RangeID: 0
      Start_DPA: 0x0
      Length: 256GB

  # ----- Port 1 / LD 0 / Range 1 -----
  - Type: LD.Range
    Enable: true
    Value:
      PortID: 1
      LDID: 0
      RangeID: 1
      Start_DPA: 0x0
      Length: 256GB

  # ----- Port 1 / LD 1 / Range 0 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 1
      LDID: 1
      RangeID: 0
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 1 / LD 1 / Range 1 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 1
      LDID: 1
      RangeID: 1
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 1 / LD 2 / Range 0 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 1
      LDID: 2
      RangeID: 0
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 1 / LD 2 / Range 1 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 1
