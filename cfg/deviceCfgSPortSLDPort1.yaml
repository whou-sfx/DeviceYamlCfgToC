      RangeID: 1
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 1 / LD 3 / Range 0 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 1
      LDID: 3
      RangeID: 0
      Start_DPA: 0x0
      Length: 0GB

  # ----- Port 1 / LD 3 / Range 1 -----
  - Type: LD.Range
    Enable: false
    Value:
      PortID: 1
      LDID: 3
      RangeID: 1
      Start_DPA: 0x0
      Length: 0GB

  # =========================
  # Dynamic Capacity Region TLVs (Disabled)
  # =========================

  # ----- Port 0 / LD 0 / DC_Region 0 -----
  - Type: LD.DC_Region
    Enable: false
    Value:
      PortID: 0
      LDID: 0
      DC_RegionID: 0
      Start_DPA: 0x0
      Decode_len: 0GB
      Block_size: 256MB
      Flags: 0

  # ----- Port 0 / LD 0 / DC_Region 1 -----
  - Type: LD.DC_Region
    Enable: false
    Value:
      PortID: 0
      LDID: 0
      DC_RegionID: 1
      Start_DPA: 0x0
      Decode_len: 0GB
      Block_size: 256MB
      Flags: 0

  # ----- Port 0 / LD 1 / DC_Region 0 -----
  - Type: LD.DC_Region
    Enable: false
